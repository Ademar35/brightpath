 if(target.dataset.stop!==undefined)return;
 if(target.dataset.seq!==undefined){setSequence(Number(target.dataset.seq));return}
 if(target.dataset.mode){setMode(target.dataset.mode);return}
 if(target.dataset.step!==undefined){pause();st.step=Number(target.dataset.step);revealed=false;save();render();return}
 if(target.dataset.role!==undefined){setRole(target.dataset.role);return}
 const a=target.dataset.action;
 if(a==='play'){togglePlay();return}if(a==='next'){navigate(1);return}if(a==='prev'){navigate(-1);return}
 if(a==='voice'){st.voice=!st.voice;save();if(playing){clearPlayback();speakAndWait()}render();return}
 if(a==='hear'){sayOnce();return}if(a==='focus'){focus=!focus;render();return}
 if(a==='restart'){pause();st.step=0;revealed=false;save();render();toast('Sequência reiniciada');return}
 if(a==='mark'){st.done[st.seq]=!st.done[st.seq];save();render();toast(st.done[st.seq]?'Sequência marcada!':'Marcação removida');return}
 if(a==='marathon'){pause();st.marathon=!st.marathon;if(st.marathon){st.seq=0;st.step=0;toast('Maratona pronta: 8 sequências')}else toast('Maratona desativada');revealed=false;save();render();return}
 if(a==='source'){sourceModal=!sourceModal;render();return}if(a==='role'){roleModal=true;render();return}
 if(a==='closeRole'){roleModal=false;render();return}if(a==='closeModalBackdrop'){if(e.target===target)closeEverything();return}
 if(a==='right'){markAnswer(true);return}if(a==='wrong'){markAnswer(false);return}
 if(a==='replay'){finish=false;st.step=0;if(st.marathon)st.seq=0;revealed=false;save();render();return}if(a==='finishClose'){finish=false;render();return}
});
document.addEventListener('change',e=>{if(e.target.dataset.change==='pace'){st.pace=Number(e.target.value);save();if(playing){clearPlayback();speakAndWait()}render();toast('Intervalo atualizado')}});
document.addEventListener('keydown',e=>{const tg=e.target;if(tg&&['INPUT','SELECT','TEXTAREA'].includes(tg.tagName))return;if(e.key==='Escape'&&(focus||sourceModal||roleModal||finish)){closeEverything();focus=false;render();return}if(sourceModal||roleModal||finish)return;if(e.key==='ArrowRight'){e.preventDefault();navigate(1)}else if(e.key==='ArrowLeft'){e.preventDefault();navigate(-1)}else if(e.code==='Space'){e.preventDefault();togglePlay()}});
// Expose a small diagnostic surface to support regression testing without changing the UI.
window.GingaTest={state:()=>({...st,playing,revealed,focus}),getCurrent:()=>currentText(),sequenceLengths:()=>SEQS.map(s=>s.steps.length)};
render();
})();
</script>
</body></html>
